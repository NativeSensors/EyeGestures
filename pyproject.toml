[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "eyeGestures"
version = "4.0.0"
authors = [
  { name="Piotr Walas", email="piotr.walas@eyegestures.com" },
]
maintainers = [
  { name="Piotr Walas", email="piotr.walas@eyegestures.com" }
]
description = "Package for eye tracking algorithm allowing for development of gaze controlled computer interface"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.13"
keywords = ["eyetracking", "eye", "gaze", "tracking", "gazetracking"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "mediapipe>=0.10.35",
    "opencv-python>=4.13.0.92",
]

[tool.maturin]
manifest-path = "engine/Cargo.toml"
features = ["python"]
no-default-features = true
python-source = "."
module-name = "eyeGestures.EyegesturesEngine"

[project.urls]
Homepage = "https://github.com/NativeSensors/EyeGestures"
Issues = "https://github.com/NativeSensors/EyeGestures/Issues"

[tool.black]
line-length = 120

[tool.isort]
line_length = 120
profile = "black"

[tool.pylint]
max-line-length = 120
generated-members = "cv2.*"
disable = [
  "too-few-public-methods",
  "too-many-instance-attributes", 
  "too-many-positional-arguments", 
  "too-many-arguments",
  "too-many-statements",
  "too-many-branches",
  "too-many-return-statements",
  "too-many-locals",
  "broad-exception-caught",
  "missing-module-docstring",
  "missing-function-docstring",
  "missing-class-docstring",
  "use-dict-literal",
  "protected-access",
  "fixme",
  "singleton-comparison"
]
module-naming-style = "any"
class-naming-style = "any"
attr-naming-style = "any"
method-naming-style = "any"
variable-naming-style = "any"
function-naming-style = "any"
argument-naming-style = "any"

[tool.flake8]
max-line-length = 120
ignore = "DAR101, DAR201, E203, E266, E712, W503"

[tool.mypy]
strict = false
plugins = ["numpy.typing.mypy_plugin"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "mediapipe.*"]
ignore_missing_imports = true
